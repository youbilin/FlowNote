name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          version="$(awk -F '\"' '/^version = / {print $2; exit}' Cargo.toml)"
          test "$GITHUB_REF" = "refs/tags/v$version"
      - name: Install native musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools shellcheck
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Check source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          shellcheck scripts/install.sh scripts/package.sh
          python3 tests/installer.py
      - name: Build static native package
        env:
          CC: musl-gcc
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --release --locked --target "$TARGET"
          test "$(target/$TARGET/release/flownote --version)" = "flownote ${GITHUB_REF_NAME#v}"
          python3 tests/e2e.py "target/$TARGET/release/flownote"
          python3 tests/e2e.py "target/$TARGET/release/flownote" --http
          "target/$TARGET/release/flownote" --preview output/preview
          bash scripts/package.sh "$TARGET" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: output/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish verified assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: output/dist
          merge-multiple: true
      - name: Assemble release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd output/dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          cp ../../scripts/install.sh install.sh
          sha256sum *.tar.gz install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > draft-status 2>/dev/null; then
            test "$(cat draft-status)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "FlowNote $GITHUB_REF_NAME" --notes-file ../../docs/RELEASE-${GITHUB_REF_NAME}.md
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS install.sh --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
