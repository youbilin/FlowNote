name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust and HTTP / TLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: HTTP, TLS and PROXY integration
        run: |
          python3 tests/e2e.py target/debug/flownote
          python3 tests/e2e.py target/debug/flownote --http
      - name: Generate synthetic previews
        run: cargo run --locked -- --preview output/preview
      - name: Installer checks
        run: |
          bash -n scripts/install.sh scripts/package.sh
          shellcheck scripts/install.sh scripts/package.sh
          python3 tests/installer.py
